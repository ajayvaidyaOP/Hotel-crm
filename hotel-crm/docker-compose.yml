# Local development stack: MySQL 8 only.
# Run the Spring Boot API (./backend) and the Vite dev server (./frontend) on the host,
# or build both with the Dockerfiles in each application folder.
services:
  mysql:
    image: mysql:8.0
    container_name: hotel-crm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-hotel_crm}
      MYSQL_USER: ${DB_USERNAME:-hotel_crm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hotel_crm}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
